name: Build X Ch APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: xch
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        working-directory: .
        run: |
          unzip -q -o *.zip
          ls -la xch

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate game icon
        run: npx capacitor-assets generate --android

      - name: Hide app from screenshots and recent apps
        run: |
          cat > android/app/src/main/java/com/xch/app/MainActivity.java <<'JAVA'
          package com.xch.app;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE,
                                   WindowManager.LayoutParams.FLAG_SECURE);
            }
          }
          JAVA

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: xch/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: X-Ch-apk
          path: xch/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
